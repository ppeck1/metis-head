[project]
name = "metis-head"
version = "0.1.0"
description = "Metis Head — simulation-first governed mock Brain for the v0.5 radio-shell buildspec (phase 0BC)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.27",
]

[project.scripts]
metis-bridge-emulator = "metis_head.bridge_emulator:run_cli"

[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metis_head*"]
exclude = ["artifacts*", "models*", "tests*"]

[tool.setuptools.package-data]
metis_head = ["static/*.html", "static/*.js"]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
]
mcp = [
  "mcp>=1.28,<2",
]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "mcp>=1.28,<2",
]
voice = [
  "piper-tts>=1.4.2",
]
mic = [
  "sounddevice>=0.4",
]
stt-whisper = [
  "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
